name: server_native_prebuilt Native Libraries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Binary release tag (e.g. server-native-prebuilt-v0.1.2). If empty, auto-uses package version."
        required: false
        type: string
  push:
    tags:
      - "server-native-prebuilt-v*"

permissions:
  contents: write

env:
  PREBUILT_PACKAGE: "server_native"
  PREBUILT_TAG_PREFIX: "server-native-prebuilt-v"

jobs:
  zig-native:
    name: Zig ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build and test Zig asset on its native architecture
        working-directory: zig
        run: |
          zig build -Doptimize=ReleaseSafe -Dstrip=true
          zig build test -Doptimize=ReleaseSafe -Dstrip=true

      - name: Install independent QUIC client
        run: |
          dart pub get
          python3 -m venv "$RUNNER_TEMP/aioquic"
          "$RUNNER_TEMP/aioquic/bin/pip" install aioquic==1.3.0
          echo "AIOQUIC_PYTHON=$RUNNER_TEMP/aioquic/bin/python" >> "$GITHUB_ENV"

      - name: Validate Zig Dart integration on its native architecture
        run: |
          dart test test/bridge_concurrency_test.dart test/sdk_http_server_compat_test.dart test/serve_ffi_http_test.dart test/serve_ffi_direct_test.dart test/zig_dart_api_test.dart test/http2_concurrency_test.dart test/http2_streaming_test.dart test/http3_shared_test.dart test/http3_backpressure_test.dart test/http3_shutdown_test.dart
          dart test test/http3_runtime_test.dart -n 'aioquic|streaming|loss|address-validation|rebinding|drain-replay'

      - name: Stage verified build
        run: |
          mkdir -p ".dart_tool/zig-built/${{ matrix.platform }}"
          cp zig/zig-out/lib/libserver_native_zig.so ".dart_tool/zig-built/${{ matrix.platform }}/"

      - name: Upload architecture build
        uses: actions/upload-artifact@v4
        with:
          name: server_native-zig-built-${{ matrix.platform }}
          path: .dart_tool/zig-built/
          include-hidden-files: true

  zig-package:
    name: Package verified Zig libraries
    needs: zig-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/download-artifact@v4
        with:
          pattern: server_native-zig-built-*
          merge-multiple: true
          path: .dart_tool/zig-built

      - name: Generate and verify combined Zig manifest
        shell: bash
        run: |
          set -euxo pipefail
          dart pub get
          if [[ "$GITHUB_REF" == refs/tags/server-native-prebuilt-v* ]]; then
            release_tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "$REQUESTED_TAG" ]]; then
            release_tag="$REQUESTED_TAG"
          else
            release_tag="server-native-prebuilt-v$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          fi
          dart run native_prebuilt manifest update \
            --config zig_prebuilt.yaml --tag "$release_tag" --strict \
            --built-library-dir .dart_tool/zig-built \
            --release-assets-dir .dart_tool/zig-release-assets \
            --output .dart_tool/zig-release-assets/server_native_zig_prebuilts.g.dart
          dart run native_prebuilt manifest verify \
            --config zig_prebuilt.yaml --tag "$release_tag" --strict \
            --built-library-dir .dart_tool/zig-built \
            --release-assets-dir .dart_tool/zig-release-assets \
            --output .dart_tool/zig-release-assets/server_native_zig_prebuilts.g.dart
          dart run native_prebuilt manifest verify-release \
            --config zig_prebuilt.yaml \
            --manifest .dart_tool/zig-release-assets/server_native_zig_prebuilts.g.dart \
            --release-assets-dir .dart_tool/zig-release-assets \
            --built-library-dir .dart_tool/zig-built --strict
          cd .dart_tool/zig-release-assets
          sha256sum *.tar.gz > SHA256SUMS-zig.txt
        env:
          REQUESTED_TAG: ${{ inputs.tag }}

      - name: Upload Zig assets and verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: server_native-zig-release
          path: .dart_tool/zig-release-assets/*
          include-hidden-files: true

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/server-native-prebuilt-v') || github.event_name == 'workflow_dispatch'
    needs: [zig-package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF:-}" == refs/tags/server-native-prebuilt-v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            version="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
            if [ -z "$version" ]; then
              echo "::error::Unable to determine server_native version from pubspec.yaml"
              exit 1
            fi
            echo "tag=${{ env.PREBUILT_TAG_PREFIX }}${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/server_native_zig_prebuilts.g.dart
            artifacts/**/SHA256SUMS-zig.txt
