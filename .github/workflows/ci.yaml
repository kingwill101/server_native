name: Zig CI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yaml"
      - "hook/**"
      - "lib/**"
      - "pubspec.yaml"
      - "test/**"
      - "tool/**"
      - "zig/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yaml"
      - "hook/**"
      - "lib/**"
      - "pubspec.yaml"
      - "test/**"
      - "tool/**"
      - "zig/**"
  workflow_dispatch:

jobs:
  test:
    name: Zig ${{ matrix.zig-version }} / Dart integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        zig-version: [0.16.0]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}


      - name: Install dependencies
        run: dart pub get

      - name: Build Zig library
        run: zig build
        working-directory: zig

      - name: Run Zig unit tests
        run: zig build test
        working-directory: zig

      - name: Regenerate and verify Zig bindings
        run: |
          python3 tool/generate_zig_bindings.py
          git diff --exit-code -- lib/src/zig_ffi.g.dart

      - name: Check changed Dart formatting
        run: dart format --output=none --set-exit-if-changed hook/build.dart lib/src/zig_ffi.g.dart test/zig_dart_api_test.dart

      - name: Analyze Dart sources
        run: dart analyze

      - name: Run Zig backend Dart integration tests
        run: |
          dart test test/serve_ffi_http_test.dart
          dart test test/native_proxy_failure_test.dart test/native_transport_contract_test.dart
          dart test test/zig_dart_api_test.dart
          dart test test/sdk_http_server_compat_test.dart test/sdk_http_server_edge_cases_test.dart test/sdk_http_server_fixtures_test.dart test/serve_ffi_direct_test.dart test/http2_concurrency_test.dart test/http2_streaming_test.dart
