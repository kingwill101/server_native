name: server_native CI

on:
  pull_request:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/server_native_ci.yml'
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/server_native_ci.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0


      - name: Get package dependencies
        working-directory: .
        run: dart pub get

      - name: Analyze Dart sources
        working-directory: .
        run: dart analyze

      - name: Run Zig backend parity tests
        working-directory: .
        run: |
          dart test test/serve_ffi_http_test.dart test/bridge_concurrency_test.dart
          dart test test/native_proxy_failure_test.dart test/native_transport_contract_test.dart
          dart test test/zig_dart_api_test.dart
          dart test test/sdk_http_server_compat_test.dart test/sdk_http_server_edge_cases_test.dart test/sdk_http_server_fixtures_test.dart test/serve_ffi_direct_test.dart test/http2_concurrency_test.dart test/http2_streaming_test.dart

      - name: Check generated FFI bindings are up to date
        working-directory: .
        run: |
          dart run tool/generate_ffi.dart
          git diff --exit-code -- lib/src/native/proxy_config.g.dart

      - name: Check generated prebuilt release metadata is up to date
        working-directory: .
        run: |
          dart run tool/generate_prebuilt_release.dart
          git diff --exit-code -- lib/src/generated/prebuilt_release.g.dart

      - name: Validate published package contents
        working-directory: .
        run: dart pub publish --dry-run
