name: server_native Benchmark Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/server_native_benchmark_gate.yml'
  push:
    branches:
      - main
    paths:
      - '**'
      - '.github/workflows/server_native_benchmark_gate.yml'
  workflow_dispatch:

jobs:
  benchmark-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0


      - name: Get dependencies
        run: dart pub get

      - name: Run server_native benchmark gate
        working-directory: .
        run: |
          dart run tool/benchmark_transport.dart \
            --requests=2500 \
            --concurrency=64 \
            --warmup=300 \
            --iterations=3 \
            --min-req-per-sec-ratio=0.70 \
            --max-p95-ratio=1.60 \
            --json > benchmark_gate_result.json

      - name: Publish benchmark JSON
        if: always()
        working-directory: .
        run: |
          echo "## server_native Benchmark Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark_gate_result.json ]; then
            cat benchmark_gate_result.json >> $GITHUB_STEP_SUMMARY
          else
            echo '{"error":"benchmark_gate_result.json not found"}' >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-native-benchmark-gate-result
          path: benchmark_gate_result.json
          if-no-files-found: ignore
          retention-days: 14
