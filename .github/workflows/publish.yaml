name: Publish

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    # Includes prereleases such as v1.0.0-dev; excludes prebuilt release tags.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  publish:
    uses: dart-lang/ecosystem/.github/workflows/publish.yaml@main
    with:
      sdk: stable
      write-comments: false
    permissions:
      contents: read
      id-token: write
      pull-requests: write
